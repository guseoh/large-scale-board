# 푸시마다 전체 테스트를 실행한다. 부하·장애 훈련은 넣지 않고, 배포도 하지 않는다. (D0-19)
name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 의미가 없으므로 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 저장소 코드를 읽기만 한다. 토큰이 새도 저장소를 바꿀 수 없게 한다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Gradle 배포판과 의존성을 캐시한다. 두 번째 실행부터 의존성 내려받기가 빠진다.
      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers는 GitHub 실행 환경(Ubuntu)의 Docker로 MySQL 컨테이너를 띄운다.
      - name: Test
        run: ./gradlew test --console=plain

      # 실패하면 어떤 테스트가 왜 실패했는지 볼 수 있게 리포트를 올린다.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            */build/reports/tests/
          retention-days: 7
