services:
  mysql:
    image: mysql:8.4.11
    container_name: large-scale-board-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${DB_NAME:-large_scale_board}
      MYSQL_USER: ${DB_USERNAME:-board}
      MYSQL_PASSWORD: ${DB_PASSWORD:-board-password}
      TZ: UTC
    ports:
      - "${DB_PORT:-3310}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
