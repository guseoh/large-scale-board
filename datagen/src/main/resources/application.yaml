spring:
  application:
    name: datagen

  main:
    # 생성기는 웹 요청을 받지 않는다. Tomcat 없이 실행하고 작업이 끝나면 종료한다.
    web-application-type: none

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${DB_PORT:3310}/${DB_NAME:large_scale_board}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:board}
    password: ${DB_PASSWORD:board-password}

  jpa:
    open-in-view: false
    hibernate:
      # 생성기는 스키마를 만들지 않는다. 실험 테이블 DDL은 db/experiment/에 직접 작성한다.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
