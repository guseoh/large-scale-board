spring:
  application:
    name: large-scale-board

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${DB_PORT:3310}/${DB_NAME:large_scale_board}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:board}
    password: ${DB_PASSWORD:board-password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

logging:
  pattern:
    # Spring Boot 기본 로그 패턴의 상관관계 ID 자리에 MDC traceId를 넣는다. 추적 필터 밖의 스레드에서는 빈 괄호다.
    correlation: "[%X{traceId:-}] "

board:
  logging:
    access-enabled: true
  snowflake:
    # 0~1023. 인스턴스마다 달라야 한다. 1023은 datagen이 쓴다.
    node-id: ${BOARD_NODE_ID:0}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: never
