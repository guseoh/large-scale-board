spring:
  application:
    name: large-scale-board

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${DB_PORT:3310}/${DB_NAME:large_scale_board}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:board}
    password: ${DB_PASSWORD:board-password}
    hikari:
      # 기본값(10)이지만 실험 조건으로 기록하고 이후 단계에서 바꾸는 변수라 명시한다.
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    threads:
      # 기본값(200)이지만 실험 조건으로 기록하려고 명시한다.
      max: 200
    mbeanregistry:
      # Tomcat 스레드 지표(tomcat_threads_busy_threads 등)를 내려면 MBean 등록을 켜야 한다.
      # 기본은 꺼져 있다.
      enabled: true

spring.lifecycle.timeout-per-shutdown-phase: 20s

logging:
  pattern:
    # Spring Boot 기본 로그 패턴의 상관관계 ID 자리에 MDC traceId를 넣는다.
    # 추적 필터 밖의 스레드에서는 빈 괄호다.
    correlation: "[%X{traceId:-}] "

board:
  logging:
    access-enabled: true
  snowflake:
    # 0~1023. 인스턴스마다 달라야 한다. 1023은 datagen이 쓴다.
    node-id: ${BOARD_NODE_ID:0}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # 모든 지표에 붙는다. 대시보드와 알림 규칙이 이 값으로 앱 지표를 고른다.
      application: board
    distribution:
      percentiles-histogram:
        # 응답 시간을 버킷별 개수로 내보낸다. 인스턴스가 여러 대여도 Prometheus가 합쳐서
        # p99를 계산할 수 있다. 대가는 시계열 수 증가(URI·상태 조합마다 버킷 수십 개). (D0-13)
        http.server.requests: true
